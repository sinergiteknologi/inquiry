name: inquiry
description: "Inquiry Harga - Price lookup application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo_apple.png
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: assets/images/logo_apple.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/logo_apple.png
    background_color: "#1B5E20"
    theme_color: "#2E7D32"
  windows:
    generate: true
    image_path: assets/images/logo_apple.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
